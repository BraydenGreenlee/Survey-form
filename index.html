<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link href="styles.css" rel="stylesheet">
  </head>
  <body>
    <div class="title-card">
      <h1>Game Survey Form</h1>
      <p>Kindly take a moment to review and share your thoughts about each game!</p>
    </div>
    <!--This a survey section -->
    <div class="form-card">
      <h2>Personal Information</h2>
      <label for="name" class="form-label">Name:</label>
      <input id="name" name="name" placeholder="John Doe" required>
      <label id="email" class="form-label">Email:</label>
      <input id="email" type="email" placeholder="Johndoe@email.com" required></input>
      <label for="Age" class="form-label">Age:</label>
      <input id="Age" name="Age" type="number" placeholder="1-99" 1-99 min="0">
    </div>
    <!--This a survey section -->
    <div class="form-card">
      <h2>How was the Game?</h2>
      <label for="dropdown" class="survey-label">Did you enjoy the game?</label>
          <select name="food" id="dropdown" class="survey-dropdown">
            <option value="">Select an option</option>
            <option value="It-was-amazing">It was amazing</option>
            <option value="Yes">Yes</option>
            <option value="Not-really">Not really</option>
            <option value="Not-at-all">Not at all</option>
          </select>
      <br>
      <label for="dropdown" class="survey-label">Did you find the graphics enticing?</label>
        <select name="graphics" id="dropdown" class="survey-dropdown">
          <option value="">Select an option</option>
          <option value="amazing">They were amazing</option>
          <option value="yes">Yes</option>
          <option value="not-really">Not really</option>
          <option value="not-at-all">Not at all</option>
        </select>
      <label for="dropdown" class="survey-label">Did you find the story interesting</label>
          <select name="story" id="dropdown" class="survey-dropdown">
            <option value="">Select an option</option>
            <option value="amazing"> It was amazing</option>
            <option value="Yes">Yes</option>
            <option value="Not-really">Not really</option>
            <option value="Not-at-all">Not at all</option>
          </select>
      <label for="dropdown" class="survey-label">Would you play it again?</label>
        <select name="replay" id="dropdown" class="survey-dropdown">
          <option value="">Select an option</option>
          <option value="yes">Yes</option>
          <option value="Probably">Probably</option>
          <option value="Probably-not">Probably not</option>
          <option value="not-at-all">Not at all</option>
        </select>
        <br>
      <label for="comments" class="comments-label">Other Comments?</label><br>
      <textarea cols="30" rows="10" name="comments" id="comments" class="comments"></textarea>
      <div class="card-links">
        <a href="#send" class="send-link">Submit</a>
      </div>
    </div>
  </body>
</html>
